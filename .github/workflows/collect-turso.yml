name: Collect MeteoSwiss + BAFU data (Turso)

on:
  schedule:
    - cron: "0 */2 * * *"   # alle 2 Stunden
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect-turso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install libsql

      - name: Run MeteoSwiss collector (KLO) -> Turso
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python collector/collect_turso.py

      - name: Run BAFU hydro collector -> Turso
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python collector/collect_hydro_turso.py
        continue-on-error: true

      - name: Export Sommer 2003 vs 2026 comparison -> Turso
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python collector/export_sommer_vergleich.py
        # Bis Ende Sommer 2026 relevant fuer aktuelle Daten, danach
        # aendert sich hier nichts mehr (beide Jahre historisch).
        continue-on-error: true

      - name: Log run
        run: python collector/log_run.py

      - name: Commit and push if changed
        run: |
          git config user.name "meteodatacollector-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add data/klo_daily.json data/hydro_latest.json data/sommer_vergleich.json logs/turso-run-log.md
          if git diff --cached --quiet; then
            echo "Keine Aenderungen."
          else
            git commit -m "Turso: Daten + run log #${{ github.run_number }}"
            git push
          fi
