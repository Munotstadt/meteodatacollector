name: Sync Hydro Azure -> Turso (einmalig)

# Nur manuell auslösbar - kein Zeitplan. Kopiert die komplette Hydro-
# Historie aus Azure SQL nach Turso, damit beide Datenbanken denselben
# Stand haben. Danach halten sich collect_hydro.py (Azure) und
# collect_hydro_turso.py (Turso) von selbst synchron.

on:
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pymssql libsql

      - name: Sync Azure hydro_readings -> Turso
        env:
          AZURE_SQL_SERVER: ${{ secrets.AZURE_SQL_SERVER }}
          AZURE_SQL_DATABASE: ${{ secrets.AZURE_SQL_DATABASE }}
          AZURE_SQL_USER: ${{ secrets.AZURE_SQL_USER }}
          AZURE_SQL_PASSWORD: ${{ secrets.AZURE_SQL_PASSWORD }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python collector/sync_hydro_azure_to_turso.py
