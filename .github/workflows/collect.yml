name: Collect MeteoSwiss + BAFU data (Azure)

# Schreibt ausschliesslich in Azure SQL Database (Archiv). Committet keine
# Frontend-Dateien mehr ins Repo - das uebernimmt seit der Umstellung auf
# Turso als Frontend-Quelle der Workflow collect-turso.yml.

on:
  schedule:
    # Fixed UTC times, 4x/day: 02:00 / 08:00 / 14:00 / 20:00 UTC.
    - cron: "0 2,8,14,20 * * *"
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pymssql

      - name: Run MeteoSwiss collector (KLO) -> Azure SQL
        env:
          AZURE_SQL_SERVER: ${{ secrets.AZURE_SQL_SERVER }}
          AZURE_SQL_DATABASE: ${{ secrets.AZURE_SQL_DATABASE }}
          AZURE_SQL_USER: ${{ secrets.AZURE_SQL_USER }}
          AZURE_SQL_PASSWORD: ${{ secrets.AZURE_SQL_PASSWORD }}
        run: python collector/collect.py

      - name: Run BAFU hydro collector (Rhein/Bodensee/Glatt) -> Azure SQL
        env:
          AZURE_SQL_SERVER: ${{ secrets.AZURE_SQL_SERVER }}
          AZURE_SQL_DATABASE: ${{ secrets.AZURE_SQL_DATABASE }}
          AZURE_SQL_USER: ${{ secrets.AZURE_SQL_USER }}
          AZURE_SQL_PASSWORD: ${{ secrets.AZURE_SQL_PASSWORD }}
        run: python collector/collect_hydro.py
        # Nicht abbrechen, falls LINDAS mal nicht erreichbar ist - der
        # Meteo-Teil oben hat trotzdem schon erfolgreich geschrieben.
        continue-on-error: true
